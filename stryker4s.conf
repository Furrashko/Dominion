# Stryker4s configuration
# https://stryker-mutator.io/docs/stryker4s/configuration/
stryker4s {
  # Sources that should be mutated (your production code, not tests)
  mutate = [ "src/main/scala/**/*.scala" ]

  # console output + HTML report under target/stryker4s-report-<timestamp>/
  reporters = [ "console", "html" ]
}
